# [START hypercomputer_gpu_tune_gemma4_ray_ray_job]
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: gemma4-tuning-job
spec:
  entrypoint: python /code/vision_train.py --model_id ${MODEL_ID} --gcs_bucket ${GCS_BUCKET}
  runtimeEnvYAML: |
    pip:
      - torch==2.10.0
      - torchvision==0.25.0
      - ray==${RAY_VERSION}
      - transformers==5.22.2
      - datasets==4.8.4
      - accelerate==1.13.0
      - pillow==12.3.0
      - bitsandbytes==0.49.2
      - trl==1.17.1
      - peft==0.21.2
  clusterSelector:
    ray.io/cluster: gemma4-tuning
# [END hypercomputer_gpu_tune_gemma4_ray_ray_job]
