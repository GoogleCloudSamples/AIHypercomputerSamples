# [START hypercomputer_gpu_infer_qwen38_2t_stage_weights_job]
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-8-2-4t-stage-weights
spec:
  backoffLimit: 2
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: qwen3-8-2-4t-stage-weights
    spec:
      serviceAccountName: workload-identity-k8s-sa
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-b200
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: stage-weights
        image: google/cloud-sdk:slim
        command: ["/bin/bash", "-lc"]
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: hf_api_token
        - name: HF_HOME
          value: /mnt/local-ssd/hf-cache
        - name: HF_XET_HIGH_PERFORMANCE
          value: "1"
        - name: PIP_BREAK_SYSTEM_PACKAGES
          value: "1"
        resources:
          requests:
            cpu: "16"
            memory: "64Gi"
          limits:
            cpu: "16"
            memory: "64Gi"
        args:
        - |
          set -euxo pipefail
          pip install --no-cache-dir -U "huggingface_hub[cli]"
          mkdir -p "${HF_HOME}"
          hf download nvidia/Qwen3.8-2.4T-A95B-NVFP4 --max-workers 16
          gcloud storage rsync "${HF_HOME}" "gs://<BUCKET_NAME>/hf-cache" --recursive
        volumeMounts:
        - name: local-ssd
          mountPath: /mnt/local-ssd
      volumes:
      - name: local-ssd
        hostPath:
          path: /mnt/stateful_partition/kube-ephemeral-ssd
          type: DirectoryOrCreate
# [END hypercomputer_gpu_infer_qwen38_2t_stage_weights_job]
