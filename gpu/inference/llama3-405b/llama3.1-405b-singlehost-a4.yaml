# [START hypercomputer_gpu_infer_llama3_405b_manifest]
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: llama3-405b-a4-disagg
spec:
  backendFramework: sglang
  env:
  - name: HF_TOKEN
    valueFrom:
      secretKeyRef:
        name: hf-secret
        key: hf_api_token
  - name: HF_HOME
    value: /root/.cache/huggingface
  - name: GLOO_SOCKET_IFNAME
    value: eth0
  - name: NCCL_SOCKET_IFNAME
    value: eth0
  components:
  - name: frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.5.0
          imagePullPolicy: IfNotPresent
          command:
          - python3
          - -m
          - dynamo.frontend
          args:
          - --router-mode
          - kv
          - --http-port
          - "8000"
          ports:
          - containerPort: 8000
            name: http
          volumeMounts:
          - name: hf-cache
            mountPath: /root/.cache/huggingface
        volumes:
        - name: hf-cache
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd/hf-cache
            type: DirectoryOrCreate

  - name: prefill
    type: prefill
    replicas: 1
    podTemplate:
      metadata:
        annotations:
          networking.gke.io/default-interface: eth0
      spec:
        nodeSelector:
          cloud.google.com/gke-accelerator: nvidia-b200
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        resourceClaims:
        - name: rdma
          resourceClaimTemplateName: default-rdma
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.5.0
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command:
          - /bin/bash
          - -lc
          args:
          - |
            if [[ -f /usr/local/gib/scripts/set_nccl_env.sh ]]; then
              source /usr/local/gib/scripts/set_nccl_env.sh
            fi
            exec python3 -m dynamo.sglang \
              --model-path nvidia/Llama-3.1-405B-Instruct-FP8 \
              --served-model-name nvidia/Llama-3.1-405B-Instruct-FP8 \
              --tp 8 \
              --trust-remote-code \
              --skip-tokenizer-init \
              --mem-fraction-static 0.85 \
              --disaggregation-mode prefill \
              --disaggregation-transfer-backend nixl \
              --disaggregation-bootstrap-port 30001 \
              --host 0.0.0.0 \
              --watchdog-timeout 3600
          securityContext:
            privileged: true
          resources:
            requests:
              nvidia.com/gpu: "8"
            limits:
              nvidia.com/gpu: "8"
            claims:
            - name: rdma
          volumeMounts:
          - name: hf-cache
            mountPath: /root/.cache/huggingface
          - name: gib
            mountPath: /usr/local/gib
          - name: dshm
            mountPath: /dev/shm
        volumes:
        - name: hf-cache
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd/hf-cache
            type: DirectoryOrCreate
        - name: gib
          hostPath:
            path: /home/kubernetes/bin/gib
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi

  - name: decode
    type: decode
    replicas: 1
    podTemplate:
      metadata:
        annotations:
          networking.gke.io/default-interface: eth0
      spec:
        nodeSelector:
          cloud.google.com/gke-accelerator: nvidia-b200
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        resourceClaims:
        - name: rdma
          resourceClaimTemplateName: default-rdma
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.5.0
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command:
          - /bin/bash
          - -lc
          args:
          - |
            if [[ -f /usr/local/gib/scripts/set_nccl_env.sh ]]; then
              source /usr/local/gib/scripts/set_nccl_env.sh
            fi
            exec python3 -m dynamo.sglang \
              --model-path nvidia/Llama-3.1-405B-Instruct-FP8 \
              --served-model-name nvidia/Llama-3.1-405B-Instruct-FP8 \
              --tp 8 \
              --trust-remote-code \
              --skip-tokenizer-init \
              --mem-fraction-static 0.85 \
              --disaggregation-mode decode \
              --disaggregation-transfer-backend nixl \
              --disaggregation-bootstrap-port 30001 \
              --host 0.0.0.0 \
              --watchdog-timeout 3600
          securityContext:
            privileged: true
          resources:
            requests:
              nvidia.com/gpu: "8"
            limits:
              nvidia.com/gpu: "8"
            claims:
            - name: rdma
          volumeMounts:
          - name: hf-cache
            mountPath: /root/.cache/huggingface
          - name: gib
            mountPath: /usr/local/gib
          - name: dshm
            mountPath: /dev/shm
        volumes:
        - name: hf-cache
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd/hf-cache
            type: DirectoryOrCreate
        - name: gib
          hostPath:
            path: /home/kubernetes/bin/gib
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi
# [END hypercomputer_gpu_infer_llama3_405b_manifest]
